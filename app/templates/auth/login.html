<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — PhishPanel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/style.css" rel="stylesheet"></head>
<body class="auth-page">
<main class="container" style="max-width:420px;margin-top:16vh">
  <div class="card p-4 shadow-sm">
    <h3>Вход в PhishPanel</h3>
    {% if flash %}<div class="alert alert-warning">{{ flash }}</div>{% endif %}
    <form method="post" action="/login">
      <input name="username" class="form-control mb-3" placeholder="Имя пользователя" required>
      <input name="password" type="password" class="form-control mb-3" placeholder="Пароль" required>
      <button class="btn btn-primary w-100">Войти</button>
    </form>
  </div>
</main>
</body></html>
