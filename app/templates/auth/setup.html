<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Настройка — PhishPanel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/style.css" rel="stylesheet"></head>
<body class="auth-page">
<main class="container" style="max-width:460px;margin-top:12vh">
  <div class="card p-4 shadow-sm">
    <h3>Защитить панель</h3>
    {% if request.query_params.flash %}<div class="alert alert-warning">{{ request.query_params.flash }}</div>{% endif %}
    <form method="post" action="/setup">
      <input name="username" class="form-control mb-3" placeholder="Имя пользователя" value="admin" required>
      <input name="password" type="password" minlength="12" class="form-control mb-3" placeholder="Пароль (минимум 12 символов)" required>
      <button class="btn btn-primary w-100">Создать учётную запись</button>
    </form>
  </div>
</main>
</body></html>
