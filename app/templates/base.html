<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PhishPanel{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar app-topbar px-3">
  <span class="navbar-brand mb-0 h1">PhishPanel</span>
</nav>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 app-sidebar p-3">
      <ul class="nav flex-column gap-1">
        {% for key, href, label in nav %}
        <li class="nav-item">
          <a class="nav-link {{ 'active' if active == key }}" href="{{ href }}">{{ label }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
    <main class="col-md-10 p-4">
      {% if flash %}<div class="alert alert-success alert-dismissible fade show">{{ flash }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
